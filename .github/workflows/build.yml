name: Flutter Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.9'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build:
    name: Build APK (signed, obfuscated, fluff)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # fluff 依赖 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory, skipping"
          fi

      # ══════════════════════════════════════════════════════
      # 自动版本号
      # ══════════════════════════════════════════════════════
      - name: Extract version from pubspec
        id: ver
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          RUN_NUM=${{ github.run_number }}
          FULL_VERSION="${BASE_VERSION}.${RUN_NUM}"
          echo "base=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "full=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$RUN_NUM" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "Full version: $FULL_VERSION"
          echo "=========================================="

      # ══════════════════════════════════════════════════════
      # 第一步：Flutter 构建（官方混淆 + 自动签名）
      # ══════════════════════════════════════════════════════
      - name: Build APK (release, obfuscated)
        run: |
          flutter clean
          flutter pub get
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --build-name=${{ steps.ver.outputs.full }} \
            --build-number=${{ steps.ver.outputs.build_number }} \
            --obfuscate \
            --split-debug-info=symbols/android-arm64 \
            --dart-define=FLUTTER_BUILD_MODE=release

      # 备份原签名 APK（用于签名对比）
      - name: Backup original APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-original.apk
          echo "✅ 原 APK 已备份: $(du -h /tmp/app-original.apk | cut -f1)"

      # ══════════════════════════════════════════════════════
      # 第二步：fluff 混淆 libapp.so（失败不挂 CI）
      # ══════════════════════════════════════════════════════
      - name: Install fluff
        id: install_fluff
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install fluff-ohos
          fluff --version

      - name: Fluff obfuscate libapp.so
        id: fluff
        if: steps.install_fluff.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          WORKDIR=/tmp/fluff_work
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/unpacked"

          unzip -o "$APK" -d "$WORKDIR/unpacked"

          LIBAPP="$WORKDIR/unpacked/lib/arm64-v8a/libapp.so"
          if [ ! -f "$LIBAPP" ]; then
            echo "❌ libapp.so 不存在"
            exit 1
          fi
          echo "📦 原始 libapp.so: $(du -h "$LIBAPP" | cut -f1)"

          fluff obfuscate --input "$LIBAPP" --output "$WORKDIR/libapp_obf.so"

          if [ ! -f "$WORKDIR/libapp_obf.so" ]; then
            echo "❌ fluff 未生成输出"
            exit 1
          fi
          echo "✅ 混淆后 libapp.so: $(du -h "$WORKDIR/libapp_obf.so" | cut -f1)"

          cp "$WORKDIR/libapp_obf.so" "$LIBAPP"

          # 删除旧签名
          rm -rf "$WORKDIR/unpacked/META-INF"

          # 重新打包
          cd "$WORKDIR/unpacked"
          zip -r -q "$WORKDIR/app-unsigned.apk" .
          cd -
          echo "✅ 重新打包: $(du -h "$WORKDIR/app-unsigned.apk" | cut -f1)"

      # ══════════════════════════════════════════════════════
      # 第三步：用同一 keystore 重新签名
      # ══════════════════════════════════════════════════════
      - name: Re-sign APK with same keystore
        if: steps.fluff.outcome == 'success'
        run: |
          set -e
          WORKDIR=/tmp/fluff_work
          UNSIGNED="$WORKDIR/app-unsigned.apk"

          KEYSTORE_FILE=$(grep '^storeFile' android/key.properties | cut -d'=' -f2 | tr -d ' ')
          KEYSTORE_PASS=$(grep '^storePassword' android/key.properties | cut -d'=' -f2 | tr -d ' ')
          KEY_ALIAS=$(grep '^keyAlias' android/key.properties | cut -d'=' -f2 | tr -d ' ')
          KEY_PASS=$(grep '^keyPassword' android/key.properties | cut -d'=' -f2 | tr -d ' ')

          KEYSTORE_PATH="android/app/$KEYSTORE_FILE"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "❌ keystore 不存在: $KEYSTORE_PATH"
            exit 1
          fi
          echo "🔐 keystore: $KEYSTORE_PATH"
          echo "🔐 alias:    $KEY_ALIAS"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)

          $ZIPALIGN -f -p 4 "$UNSIGNED" "$WORKDIR/app-aligned.apk"

          $APKSIGNER sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$WORKDIR/app-release-fluff.apk" \
            "$WORKDIR/app-aligned.apk"

          cp "$WORKDIR/app-release-fluff.apk" build/app/outputs/flutter-apk/app-release.apk
          echo "✅ 重签完成"

      # ══════════════════════════════════════════════════════
      # 第四步：验证签名
      # ══════════════════════════════════════════════════════
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)

          echo "════════ 最终 APK 证书 ════════"
          $APKSIGNER verify --print-certs "$APK"

          if [ -f /tmp/app-original.apk ] && [ "${{ steps.fluff.outcome }}" = "success" ]; then
            echo ""
            echo "════════ 签名一致性检查 ════════"
            ORIG_SHA=$($APKSIGNER verify --print-certs /tmp/app-original.apk | grep "SHA-256" | head -1)
            NEW_SHA=$($APKSIGNER verify --print-certs "$APK" | grep "SHA-256" | head -1)
            echo "原 APK:  $ORIG_SHA"
            echo "新 APK:  $NEW_SHA"
            if [ "$ORIG_SHA" = "$NEW_SHA" ]; then
              echo "✅ 签名一致，可覆盖安装"
            else
              echo "❌ 签名不一致！"
              exit 1
            fi
          else
            echo "ℹ️ fluff 未执行，使用原始签名"
          fi

      # ══════════════════════════════════════════════════════
      # 上传产物（只上传 APK）
      # ══════════════════════════════════════════════════════
      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-glass-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      # ══════════════════════════════════════════════════════
      # 自动创建 Release（只含 APK）
      # ══════════════════════════════════════════════════════
      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.full }}
          name: Release v${{ steps.ver.outputs.full }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}