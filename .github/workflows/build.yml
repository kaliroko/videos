name: Flutter Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.9'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build:
    name: Build APK (signed, obfuscated)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory, skipping"
          fi

      # ══════════════════════════════════════════════════════
      # ★ 自动版本号：base version + run_number
      # ══════════════════════════════════════════════════════
      - name: Extract version from pubspec
        id: ver
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          RUN_NUM=${{ github.run_number }}
          FULL_VERSION="${BASE_VERSION}.${RUN_NUM}"
          echo "base=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "full=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$RUN_NUM" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "Base version: $BASE_VERSION"
          echo "Run number:   $RUN_NUM"
          echo "Full version: $FULL_VERSION"
          echo "=========================================="

      - name: Build APK (release, obfuscated)
        run: |
          flutter clean
          flutter pub get
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --build-name=${{ steps.ver.outputs.full }} \
            --build-number=${{ steps.ver.outputs.build_number }} \
            --obfuscate \
            --split-debug-info=symbols/android-arm64 \
            --dart-define=FLUTTER_BUILD_MODE=release

      - name: Build App Bundle (release, obfuscated)
        run: |
          flutter build appbundle \
            --release \
            --target-platform=android-arm64 \
            --build-name=${{ steps.ver.outputs.full }} \
            --build-number=${{ steps.ver.outputs.build_number }} \
            --obfuscate \
            --split-debug-info=symbols/aab \
            --dart-define=FLUTTER_BUILD_MODE=release

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using: $APKSIGNER"
          $APKSIGNER verify --print-certs $APK

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-glass-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-glass-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      # ══════════════════════════════════════════════════════
      # ★ 自动创建 Release（tag 用 4 段版本号，天然不冲突）
      # ══════════════════════════════════════════════════════
      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.full }}
          name: Release v${{ steps.ver.outputs.full }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}