name: Flutter Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.9'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build:
    name: Build APK (signed, obfuscated)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # ★ 构建 APK（加混淆 + symbols）
      - name: Build APK (release, obfuscated)
        run: |
          flutter clean
          flutter pub get
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --obfuscate \
            --split-debug-info=symbols/android-arm64 \
            --dart-define=FLUTTER_BUILD_MODE=release

      # ★ 构建 AAB（同样加混淆）
      - name: Build App Bundle (release, obfuscated)
        run: |
          flutter build appbundle \
            --release \
            --target-platform=android-arm64 \
            --obfuscate \
            --split-debug-info=symbols/aab \
            --dart-define=FLUTTER_BUILD_MODE=release

      # ★ 验证签名（关键：确认不是 debug 签名）
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using: $APKSIGNER"
          $APKSIGNER verify --print-certs $APK

      # 上传混淆符号表（线上崩溃还原必须，保留 90 天）
      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-glass-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-glass-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: Release ${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}