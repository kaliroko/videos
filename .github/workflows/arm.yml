name: Build ARM32 APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.9'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-arm32-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build:
    name: Build ARM32 APK (armeabi-v7a)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-arm32-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory, skipping"
          fi

      # ══════════════════════════════════════════════════════
      # 版本号 = base + run_number
      # ══════════════════════════════════════════════════════
      - name: Extract version from pubspec
        id: ver
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          RUN_NUM=${{ github.run_number }}
          FULL_VERSION="${BASE_VERSION}.${RUN_NUM}"
          echo "base=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "full=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$RUN_NUM" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "Base version: $BASE_VERSION"
          echo "Run number:   $RUN_NUM"
          echo "Full version: $FULL_VERSION"
          echo "=========================================="

      # ══════════════════════════════════════════════════════
      # ★ 关键：只构建 android-arm (armeabi-v7a, 32位)
      # ══════════════════════════════════════════════════════
      - name: Build ARM32 APK (release, obfuscated)
        run: |
          flutter clean
          flutter pub get
          flutter build apk \
            --release \
            --target-platform=android-arm \
            --build-name=${{ steps.ver.outputs.full }} \
            --build-number=${{ steps.ver.outputs.build_number }} \
            --obfuscate \
            --split-debug-info=symbols/android-arm \
            --dart-define=FLUTTER_BUILD_MODE=release

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using: $APKSIGNER"
          $APKSIGNER verify --print-certs $APK

      # ══════════════════════════════════════════════════════
      # ★ 重命名 APK（明显区分 arm32 版本）
      # ══════════════════════════════════════════════════════
      - name: Rename APK with arm32 suffix
        run: |
          SRC=build/app/outputs/flutter-apk/app-release.apk
          DST=build/app/outputs/flutter-apk/bili-glass-arm32-v${{ steps.ver.outputs.full }}.apk
          mv "$SRC" "$DST"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: symbols-arm32-${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Upload ARM32 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-glass-arm32-apk
          path: build/app/outputs/flutter-apk/bili-glass-arm32-v${{ steps.ver.outputs.full }}.apk
          retention-days: 14
          if-no-files-found: error

      # ══════════════════════════════════════════════════════
      # 自动创建 Release（tag 用 arm32 后缀区分）
      # ══════════════════════════════════════════════════════
      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.full }}-arm32
          name: ARM32 Release v${{ steps.ver.outputs.full }}
          files: |
            build/app/outputs/flutter-apk/bili-glass-arm32-v${{ steps.ver.outputs.full }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}