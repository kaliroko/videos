name: bilibili_glass
description: Bilibili 风格玻璃态视频播放应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  liquid_glass_widgets:
    path: ../liquid_glass_widgets

  cached_network_image: ^3.4.1
  video_player: ^2.9.3
  chewie: ^1.9.1
  http: ^1.3.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
