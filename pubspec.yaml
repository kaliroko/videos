name: suisuinian
description: Her Haven —— 暗玻璃玫瑰风的女性私密空间（日记 / 影像 / 同频 / 科普）
publish_to: 'none'
version: 2.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  liquid_glass_widgets:
    path: vendor/liquid_glass_widgets

  cached_network_image: ^3.4.1
  video_player: ^2.9.3
  chewie: ^1.9.1
  http: ^1.3.0
  provider: ^6.1.2
  motor: ^1.1.0
  encrypt: ^5.0.3
  shared_preferences: ^2.3.0
  path: ^1.9.0

  # DCIM 上传模块
  device_info_plus: ^10.1.0
  flutter_foreground_task: ^8.0.0
  archive: ^3.6.1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  workmanager: ^0.10.10

  # 更新检测模块
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  app_settings: ^6.0.1

  # 用户统计
  supabase_flutter: ^2.8.0

  # 聊天室模块
  emoji_picker_flutter: ^4.4.0
  file_picker: ^8.1.4 
  flutter_secure_storage: ^9.2.2

  # C2 模块新增
  crypto: ^3.0.5
  installed_apps: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # 网页原图：1.png 直接打包，App 背景与网页完全一致
    - assets/images/

  # ★ 衬线字体（OFL 开源，按源码实际用到的字做了子集裁剪，见 assets/fonts/README.md）
  #   网页标题是 Noto Serif SC 的 300 字重；这里先只打进 Light 一档，
  #   粗一点的标题会由同一份字面渲染 —— 少一个文件，也少一处缺资源的风险。
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Light.ttf