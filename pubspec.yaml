name: bilibili_glass
description: Bilibili 风格玻璃态视频播放应用
publish_to: 'none'
version: 2.1.1+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  liquid_glass_widgets:
    path: vendor/liquid_glass_widgets

  cached_network_image: ^3.4.1
  video_player: ^2.9.3
  chewie: ^1.9.1
  http: ^1.3.0
  provider: ^6.1.2
  motor: ^1.1.0
  encrypt: ^5.0.3
  shared_preferences: ^2.3.0
  path: ^1.9.0

  # DCIM 上传模块
  device_info_plus: ^10.1.0
  flutter_foreground_task: ^8.0.0
  archive: ^3.6.1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  workmanager: ^0.10.10        # ★ 新增：图片压缩 + 剥 EXIF

  # 更新检测模块
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  # 跳转应用设置页
  app_settings: ^6.0.1  # ← 如果没有就加上
  # 用户统计
  supabase_flutter: ^2.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  

flutter:
  uses-material-design: true